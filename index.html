    <!-- Critical Above-the-Fold Inline CSS (Prevents CLS, Zero Render Blocking, Speedup FCP/LCP) -->
    <style>
      :root {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      *, ::before, ::after {
        box-sizing: border-box;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #fcfcfd;
        color: #171717;
        min-height: 100vh;
      }
      html.dark body, body.dark {
        background-color: #202124;
        color: #e8eaed;
      }
      /* Pre-render Hero Skeleton & Layout Guard */
      .sk-container {
        width: 100%;
        max-width: 80rem;
        margin: 0 auto;
        padding: 1rem 1.25rem 3rem;
      }
      .sk-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1rem 0;
        margin-bottom: 2rem;
        border-bottom: 1px solid rgba(229, 231, 235, 0.6);
      }
      .sk-logo-group {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .sk-logo-icon {
        width: 2.25rem;
        height: 2.25rem;
        background: #2563eb;
        border-radius: 0.75rem;
      }
      .sk-logo-text {
        height: 1.5rem;
        width: 6rem;
        background: #e5e7eb;
        border-radius: 0.375rem;
      }
      .sk-hero {
        text-align: center;
        max-width: 48rem;
        margin: 0 auto 2.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .sk-badge {
        height: 1.75rem;
        width: 14rem;
        background: #eff6ff;
        border: 1px solid #dbeafe;
        border-radius: 9999px;
        margin-bottom: 1.25rem;
      }
      .sk-title {
        height: 2.75rem;
        width: 85%;
        max-width: 36rem;
        background: #e5e7eb;
        border-radius: 0.5rem;
        margin-bottom: 1rem;
      }
      .sk-subtitle {
        height: 1.25rem;
        width: 95%;
        max-width: 30rem;
        background: #f3f4f6;
        border-radius: 0.375rem;
      }
      .sk-dropzone {
        width: 100%;
        max-width: 48rem;
        height: 18rem;
        margin: 0 auto;
        background: #ffffff;
        border: 2px dashed #cbd5e1;
        border-radius: 1.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
      }
      .sk-dropzone-icon {
        width: 4rem;
        height: 4rem;
        background: #eff6ff;
        border-radius: 1rem;
        margin-bottom: 1.25rem;
      }
      .sk-dropzone-text {
        height: 1.25rem;
        width: 16rem;
        background: #e5e7eb;
        border-radius: 0.375rem;
        margin-bottom: 0.75rem;
      }
      .sk-dropzone-sub {
        height: 1rem;
        width: 22rem;
        background: #f3f4f6;
        border-radius: 0.375rem;
      }
      /* Dark mode skeleton overrides */
      html.dark .sk-logo-text, html.dark .sk-title { background: #3c4043; }
      html.dark .sk-subtitle, html.dark .sk-dropzone-sub { background: #303134; }
      html.dark .sk-badge { background: #1e293b; border-color: #334155; }
      html.dark .sk-dropzone { background: #202124; border-color: #3c4043; }
      html.dark .sk-dropzone-icon { background: #1e293b; }
      html.dark .sk-dropzone-text { background: #3c4043; }
      html.dark .sk-header { border-bottom-color: #3c4043; }
      
      @keyframes skPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
      }
      .sk-animate {
        animation: skPulse 1.8s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
    </style>
